name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    # Deployment stays intentionally off until the customer project and GitHub
    # service-account secret have been supplied and this repository variable is true.
    if: vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ACTIVE_SELF_CONTROL }}
          channelId: live
          projectId: active-self-control
