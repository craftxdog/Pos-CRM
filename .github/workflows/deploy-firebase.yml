name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    # Deployment stays intentionally off until the customer project and GitHub
    # service-account secret have been supplied and this repository variable is true.
    if: vars.FIREBASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production configuration
        env:
          VITE_APP_SUPABASE_URL: ${{ secrets.VITE_APP_SUPABASE_URL }}
          VITE_APP_SUPABASE_ANON_KEY: ${{ secrets.VITE_APP_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_APP_SUPABASE_URL"
          test -n "$VITE_APP_SUPABASE_ANON_KEY"
      - name: Build production application
        env:
          VITE_APP_SUPABASE_URL: ${{ secrets.VITE_APP_SUPABASE_URL }}
          VITE_APP_SUPABASE_ANON_KEY: ${{ secrets.VITE_APP_SUPABASE_ANON_KEY }}
          VITE_APP_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_APP_GOOGLE_AUTH_ENABLED }}
          VITE_PRINT_SERVICE_URL: ${{ vars.VITE_PRINT_SERVICE_URL }}
        run: npm run build
      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGOGE_ACADEMY }}
          channelId: live
          projectId: agoge-academy
